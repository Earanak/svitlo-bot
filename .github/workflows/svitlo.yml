name: svitlo

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      reply:
        default: "0"
      wait:
        default: ""
      debug:
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: svitlo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.64.1

      - name: Install Playwright
        run: |
          pip install -q playwright==1.64.1 pillow
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && break
            sleep 20
          done
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null || true

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ADDRESS: ${{ secrets.ADDRESS }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROUP: ${{ vars.GROUP }}
          REPLY: ${{ inputs.reply }}
          WAIT_MSG: ${{ inputs.wait }}
          DEBUG_HOUSES: ${{ inputs.debug }}
        run: python svitlo.py

      - name: Save state
        if: always()
        run: |
          git config user.name "svitlo-bot"
          git config user.email "svitlo-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "state"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep $((i * 10))
          done
          echo "::warning::state not saved"

      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion' || echo "")
          chat=$(python -c "import json;print(json.load(open('state.json')).get('chat_id',''))" 2>/dev/null || echo "")
          if [ "$prev" = "success" ] && [ -n "$chat" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat}" \
              --data-urlencode "text=⚠️ Бот не смог запуститься (сбой на стороне GitHub). Закреп может быть устаревшим, попробую снова через 10 минут."
          fi

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/svitlo.yml/enable" || true
