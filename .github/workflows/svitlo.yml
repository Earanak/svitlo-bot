name: svitlo

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: svitlo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.64.1

      - name: Install Playwright
        run: |
          pip install -q playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ADDRESS: ${{ secrets.ADDRESS }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROUP: ${{ vars.GROUP }}
        run: python svitlo.py

      - name: Save state
        if: always()
        run: |
          git config user.name "svitlo-bot"
          git config user.email "svitlo-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "state" && git pull -q --rebase && git push -q)

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/svitlo.yml/enable" || true
